name: Build and test

on:
  push:
    branches: ["1.21.1", "26.1.2"]
  pull_request:
    branches: ["1.21.1", "26.1.2"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check Minecraft target
        run: test "$(sed -n 's/^minecraft_version=//p' gradle.properties)" = "1.21.1"
      - name: Build and run GameTests
        run: ./gradlew clean build runGameTest --console=plain
      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametests-1.21.1
          path: build/reports/gametest/
          if-no-files-found: warn
