name: Release Minecraft 26.1.2

on:
  push:
    tags:
      - 'v*\+mc26.1.2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MINECRAFT_VERSION: "26.1.2"
  JAVA_VERSION: "25"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and release branch
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/release.py validate-tag --tag "$RELEASE_TAG" --minecraft "$MINECRAFT_VERSION" --java "$JAVA_VERSION"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$MINECRAFT_VERSION"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build and run GameTests
        run: ./gradlew clean build runGameTest --console=plain
      - name: Verify and stage release jars
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py stage --tag "$RELEASE_TAG" --minecraft "$MINECRAFT_VERSION" --java "$JAVA_VERSION"
      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametests-26.1.2
          path: build/reports/gametest/
          if-no-files-found: warn
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aedan's Unicorns ${{ github.ref_name }}"
          body_path: CHANGELOG-26.1.2.md
          make_latest: true
          fail_on_unmatched_files: true
          files: build/release/*.jar
      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: gWWYaw4W
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/release/aedans-unicorn-${{ steps.release.outputs.version }}.jar
          name: "Aedan's Unicorns ${{ github.ref_name }}"
          version: ${{ steps.release.outputs.version }}
          changelog-file: CHANGELOG-26.1.2.md
          loaders: fabric
          game-versions: "26.1.2"
