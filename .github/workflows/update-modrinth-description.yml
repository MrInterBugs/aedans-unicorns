name: Update Modrinth description
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update project description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          DESCRIPTION_B64: ""
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, urllib.request
          body = base64.b64decode(os.environ['DESCRIPTION_B64']).decode()
          request = urllib.request.Request(
              'https://api.modrinth.com/v2/project/gWWYaw4W',
              data=json.dumps({'body': body}).encode(),
              method='PATCH',
              headers={
                  'Authorization': os.environ['MODRINTH_TOKEN'],
                  'Content-Type': 'application/json',
                  'User-Agent': 'MrInterBugs/aedans-unicorns description update',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204, response.status
          print('Modrinth description updated')
          PYTHON
