plugins {
    id 'maven-publish'
    id "com.github.ben-manes.versions" version "${versions_version}"
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.palantir.git-version' version "${git_version}"
}

def rawVersion = gitVersion()
def modVersion = rawVersion.startsWith("v") ? rawVersion.substring(1) : rawVersion
def loaderVersion = providers.gradleProperty("loader_version").get()
def fabricVersion = providers.gradleProperty("fabric_version").get()
def minecraftVersion = providers.gradleProperty("minecraft_version").get()
def reiVersion = providers.gradleProperty("rei_version").get()
def ryoamiclightsVersion = providers.gradleProperty("ryoamiclights_version").get()
def obsidianuiVersion = providers.gradleProperty("obsidianui_version").get()
def lombokVersion = providers.gradleProperty("lombok_version").get()
def archivesBaseName = providers.gradleProperty("archives_base_name").get()

group = property('maven_group')
version = modVersion
base.archivesName = archivesBaseName

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "unicorn" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
    // Optional deps — awaiting 26.1.2 releases before re-enabling
    // compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${reiVersion}"
    // compileOnly "maven.modrinth:ryoamiclights:${ryoamiclights_version}"
    // compileOnly "maven.modrinth:obsidianui:${obsidianui_version}"
    // runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${reiVersion}"
    compileOnly files("C:/Users/aedan/AppData/Roaming/PrismLauncher/instances/26.1.2/minecraft/mods/jei-26.1.2-fabric-29.6.2.31.jar")
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

processResources {
    inputs.property "version", modVersion
    filteringCharset = 'UTF-8'
    def expandProps = [
            version: modVersion,
            loader_version: loaderVersion,
            fabric_version: fabricVersion,
            minecraft_version: minecraftVersion,
            ryoamiclights_version: ryoamiclightsVersion,
            obsidianui_version: obsidianuiVersion,
            rei_version: reiVersion
    ]
    filesMatching("fabric.mod.json") {
        expand(expandProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
